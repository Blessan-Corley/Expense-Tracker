name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  JWT_SECRET: 'ci-test-jwt-secret-key'

jobs:
  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
        run: npx prisma generate

      - name: Push database schema
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
        run: npx prisma db push

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
          JWT_SECRET: ${{ env.JWT_SECRET }}
          NODE_ENV: test
        run: npm run test --workspace=@expense-tracker/backend -- --coverage --forceExit

      - name: Upload backend coverage
        uses: codecov/codecov-action@v3
        with:
          directory: apps/backend/coverage
          flags: backend
          fail_ci_if_error: false

  # Frontend Tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend linting
        run: npm run lint --workspace=@expense-tracker/frontend

      - name: Run frontend tests
        run: npm run test --workspace=@expense-tracker/frontend

      - name: Build frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build --workspace=@expense-tracker/frontend

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          directory: apps/frontend/coverage
          flags: frontend
          fail_ci_if_error: false

  # Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/expense-tracker:latest
            ${{ secrets.DOCKER_USERNAME }}/expense-tracker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Production
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Deploying to production..."
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/expense-tracker:${{ github.sha }}"
          
      # Add your deployment steps here
      # Examples:
      # - Deploy to AWS ECS
      # - Deploy to Google Cloud Run
      # - Deploy to Azure Container Apps
      # - Deploy to DigitalOcean App Platform
      # - SSH and pull new image

  # Code Quality
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Check for security vulnerabilities
        run: |
          npm audit --workspace=@expense-tracker/backend --audit-level=high || true
          npm audit --workspace=@expense-tracker/frontend --audit-level=high || true

      - name: Check for outdated packages
        run: |
          npm outdated --workspace=@expense-tracker/backend || true
          npm outdated --workspace=@expense-tracker/frontend || true
